[build]
  publish = "."
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self' https:; script-src 'self' https:; style-src 'self' 'unsafe-inline' https:; font-src 'self' data: https:; img-src 'self' data: https: blob:; media-src 'self' https: blob:; connect-src 'self' https: wss: data: blob: http://localhost:* http://127.0.0.1:*; frame-src 'self' https:; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"

[[headers]]
  # HTML: cache corto para permitir actualizaciones frecuentes
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  # CSS con fingerprint vía query (?v=...): cache largo e immutable
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  # JS con fingerprint vía query (?v=...): cache largo e immutable
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  # Imágenes estáticas del sitio
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  # Fuente del sitio si existiera (local)
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/api/rss"
  to = "/.netlify/functions/rss"
  status = 200

[[redirects]]
  from = "/api/aggregate"
  to = "/.netlify/functions/aggregate"
  status = 200

[[scheduled]]
  path = "/.netlify/functions/warm"
  schedule = "*/5 * * * *"
