[build]
  publish = "."
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self' https:; script-src 'self' https:; style-src 'self' 'unsafe-inline' https:; font-src 'self' data: https:; img-src 'self' data: https: blob:; media-src 'self' https: blob:; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; frame-src 'self' https:; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"

[[redirects]]
  from = "/api/rss"
  to = "/.netlify/functions/rss"
  status = 200

[[redirects]]
  from = "/api/aggregate"
  to = "/.netlify/functions/aggregate"
  status = 200

[[scheduled]]
  path = "/.netlify/functions/warm"
  schedule = "*/5 * * * *"
